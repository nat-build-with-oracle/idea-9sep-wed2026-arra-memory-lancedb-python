# Build and publish the add-on image for both architectures.
#
# Home Assistant pulls a prebuilt image rather than building on the HA host —
# without that, Supervisor builds locally on every install: the Debian base plus
# ~400MB of pyarrow and lancedb wheels over whatever connection that box has. It
# also reports a FAILED build as a successful update and leaves the old version
# running, because it reports the request rather than the result.
name: builder

on:
  push:
    branches: [main]
    paths:
      - "arra-memory-lancedb/**"
      - "arra_memory/**"
      - "pyproject.toml"
      - ".github/workflows/builder.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      # The UI bundle must be in the image: the server serves it from the
      # package, and an add-on with no bundle is a working API behind a blank
      # page. Built here rather than committed-and-trusted, so the image cannot
      # ship a stale bundle.
      - uses: oven-sh/setup-bun@v2
      - run: cd ui && bun install --frozen-lockfile && bun run build

      # Supervisor builds an add-on with the ADD-ON DIRECTORY as the Docker
      # context, so the package has to be inside it. One script defines that
      # layout, and the local verification build uses the same output.
      # Into a path INSIDE the repo, because the builder runs in a container
      # that mounts the workspace at /data and resolves --target relative to it.
      # An absolute host path made it look outside the mount, where there is no
      # build.yaml — which it reports as the almost-helpful
      # "No build information or from not provided. Using default base image."
      # and then dies on a missing config.json.
      - run: ./arra-memory-lancedb/package.sh "${{ github.workspace }}/build/arra-memory-lancedb"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Warm the builder image before the action reaches for it.
      #
      # home-assistant/builder runs `docker pull ghcr.io/home-assistant/<arch>-builder`
      # itself, with no retry, and a `-e -o pipefail` shell — so a single
      # `toomanyrequests` from ghcr fails the whole run. That is not a
      # hypothetical: three consecutive builds died on it, on a pull that has
      # nothing to do with this repository's own images. A pull that already
      # succeeded is a cache hit inside the action.
      #
      # Never fails the job: if the warm-up cannot get the image, the action's
      # own pull is still allowed to try and to report the real error.
      - name: Warm the builder image
        continue-on-error: true
        run: |
          # The version the action falls back to when used at @master. Kept in
          # step with that default; if it drifts, this warms the wrong tag and
          # the build is no worse off than it is without this step.
          image="ghcr.io/home-assistant/amd64-builder:2026.02.1"
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              echo "warmed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; backing off"
            sleep $((attempt * 15))
          done
          echo "could not warm $image — letting the action try"

      - name: Build and push
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target build/arra-memory-lancedb \
            --image {arch}-addon-arra_memory_lancedb \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon
