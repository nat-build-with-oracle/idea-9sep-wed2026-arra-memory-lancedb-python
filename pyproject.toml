[project]
name = "arra-memory-lancedb"
version = "0.1.0"
description = "A durable memory corpus on LanceDB — web UI, REST, and a remote MCP endpoint for Claude — the Python port of arra-memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "lancedb>=0.38",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "pyarrow>=15",
]

[project.optional-dependencies]
fleet = ["paho-mqtt>=2.0"]
dev = ["pytest>=8", "paho-mqtt>=2.0"]

[project.scripts]
arra-memory = "arra_memory.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arra_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
